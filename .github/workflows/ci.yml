name: CI

on:
  pull_request: ~
  push: ~

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            laravel: "^12.0"
            testbench: "^10.0"
          - php: "8.4"
            laravel: "^12.0"
            testbench: "^10.0"
          - php: "8.3"
            laravel: "^13.0"
            testbench: "^11.0"
          - php: "8.4"
            laravel: "^13.0"
            testbench: "^11.0"
            coverage: true
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - run: composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
      - run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
      - run: composer update --prefer-dist --no-interaction

      - run: echo "$PWD/vendor/bin" >> "$GITHUB_PATH"

      - run: pint --test

      - if: "!matrix.coverage"
        run: pest --coverage --min=100

      - if: matrix.coverage
        run: pest --coverage --coverage-clover coverage.xml --min=100

      - if: matrix.coverage
        name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
